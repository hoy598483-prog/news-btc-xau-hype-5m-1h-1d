[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-btc-xau-hype-multihorizon"
version = "0.1.0"
description = "Truth Social event study for BTC, XAU and HYPE over 5m, 1h and 1d horizons"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "python-dateutil>=2.9",
  "scipy>=1.13",
]

[project.scripts]
news-market-study = "news_btc_research.cli:main"
news-market-train = "news_btc_research.strategy:main"

[tool.setuptools.packages.find]
include = ["news_btc_research*"]
